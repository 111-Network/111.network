# Dependency updates (SECURITY.md, "Dependencies"). One grouped PR per area,
# weekly, so a security release of Next.js or React is never waiting on a
# human to notice it. Every PR still has to pass `pnpm check` and `pnpm e2e`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      radix:
        patterns: ["@radix-ui/*"]
      dev-tooling:
        dependency-type: development
    ignore:
      # TypeScript 7 (the native compiler) is not loadable by typescript-eslint
      # 8.x yet, so lint cannot run on it. Lift this once typescript-eslint
      # supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node type majors follow the runtime major in package.json `engines`,
      # bumped by hand together with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
